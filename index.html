<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Lumière · 娛樂手札</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:#2A2520;min-height:100vh;}
body{background:#F4F3F8;color:#2A2520;font-family:'Noto Sans TC','PingFang TC',sans-serif;font-size:15px;font-weight:400;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;}
#root{width:100%;max-width:480px;min-height:100vh;padding-bottom:80px;position:relative;overflow-x:hidden;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#C8C0B4;border-radius:2px;}
input,textarea,select{
  background:#FBF9F6;border:1.5px solid #C0B8B0;color:#2A2520;
  font-family:'Noto Sans TC',sans-serif;font-size:14px;font-weight:400;
  border-radius:12px;padding:10px 14px;width:100%;max-width:100%;outline:none;
  transition:border-color .18s;-webkit-appearance:none;
}
input:focus,textarea:focus,select:focus{border-color:#B09080;}
input::placeholder,textarea::placeholder{color:#A09088;}
select option{background:#FBF9F6;}
button{cursor:pointer;font-family:inherit;font-weight:400;border:none;outline:none;background:none;}
.tap{transition:opacity .1s,transform .1s;}@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.tap:active{opacity:.55;transform:scale(.96);}
.num{font-family:'Outfit','Noto Sans TC',sans-serif;font-weight:200;}
input[type="date"]{min-width:0;width:100%;}
select{background-image:none!important;-webkit-appearance:none;-moz-appearance:none;appearance:none;}
.page{width:100%;padding:20px 18px 8px;}
.page-inner{width:100%;padding:10px 18px 0;}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect,useRef}=React;

/* ── TOKENS ────────────────────────────────────────── */
const T={
  /* backgrounds */
  bg:       "#F4F3F8",   /* 微薰衣草白 */
  surface:  "#FAFAF8",
  white:    "#FFFFFF",
  /* ink */
  ink:      "#2A2520",
  ink2:     "#4A4540",
  ink3:     "#706870",
  ink4:     "#9A90A0",
  /* lines */
  line:     "#E0DCE8",
  lineSoft: "#EEEAF4",
  bg2:      "#EDECF4",
  /* JH primary palette */
  rose:     "#E8A8A0",   roseBg:"#FDF0EE",   /* Coral */
  navy:     "#3A4A6B",   navyBg:"#EEF1F8",   /* Blue */
  peri:     "#B0B8D8",   periBg:"#F0F1FA",   /* Periwinkle */
  /* JH secondary */
  sage:     "#7A9888",   sageBg:"#EDF4F0",   /* Sage (自補) */
  maroon:   "#7A3848",   maroonBg:"#F5EBEE", /* Maroon */
  smoke:    "#8A9098",   smokeBg:"#F0F2F4",  /* Smoke */
  /* legacy aliases kept for backward compat */
  slate:    "#6080B8",   slateBg:"#EEF1F8",
  mauve:    "#C8A0D0",   mauveBg:"#F5F0FA",
  sand:     "#B8986A",   sandBg:"#F2EAE0",
  olive:    "#7A9888",   oliveBg:"#EDF4F0",
  coral:    "#E8A8A0",   coralBg:"#FDF0EE",
  teal:     "#6080B8",   tealBg:"#EEF1F8",
  /* category colour system */
  catM:{line:"#6080B8",bg:"#EEF1F8",text:"#3A5090"},   /* 電影 — Blue */
  catD:{line:"#7A9888",bg:"#EDF4F0",text:"#3A6858"},   /* 戲劇 — Sage */
  catE:{line:"#E8A8A0",bg:"#FDF0EE",text:"#A06060"},   /* 活動 — Coral */
  catC:{line:"#C8A0D0",bg:"#F5F0FA",text:"#7848A0"},   /* 演唱會 — Mauve/Peri */
};
const FACE_C=["","#C07068","#B09050","#5A9870","#4878B0","#8860B8"];
const DSubs=["韓劇","美劇","日劇","台劇","陸劇","短劇","實境秀","動漫","紀錄片"];
const DTC={
  韓劇:{l:"#9878B8",t:"#684898"},美劇:{l:"#6E88B0",t:"#3A5A88"},
  日劇:{l:"#C09090",t:"#906060"},台劇:{l:"#88C0A0",t:"#2E7858"},
  實境秀:{l:"#B8986A",t:"#785828"},動漫:{l:"#88A070",t:"#486030"},
  紀錄片:{l:"#5E9898",t:"#2E6868"},
  陸劇:{l:"#C08060",t:"#804020"},短劇:{l:"#A06898",t:"#604878"},
};
const catSt=c=>({電影:T.catM,戲劇:T.catD,展覽:T.catE,演唱會:T.catC}[c]||T.catM);

/* ── DATA ──────────────────────────────────────────── */
const NOW=new Date(),TY=NOW.getFullYear(),TM=NOW.getMonth()+1;
const ymd=(y,m,d)=>`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const pm=n=>{const d=new Date(TY,TM-1-n,1);return{y:d.getFullYear(),m:d.getMonth()+1};};
const EMPTY_DATA={title:"我的娛樂手札",movies:[],dramas:[],exhibitions:[],concerts:[],watchlater:[]};
function loadData(){
  try{const s=localStorage.getItem("lumiere_data");const d=s?JSON.parse(s):EMPTY_DATA;if(!d.watchlater)d.watchlater=[];return d;}
  catch{return EMPTY_DATA;}
}
function saveData(d){
  try{localStorage.setItem("lumiere_data",JSON.stringify(d));}catch{}
}
function loadSettings(){
  try{const s=localStorage.getItem("lumiere_settings");return s?JSON.parse(s):{name:"",dark:false};}
  catch{return{name:"",dark:false};}
}
function saveSettings(s){
  try{localStorage.setItem("lumiere_settings",JSON.stringify(s));}catch{}
}

/* ── UTILS ─────────────────────────────────────────── */
const fD=s=>{if(!s)return"";const[y,m,d]=s.split("-");return`${y} · ${+m}月${+d}日`;};
const fDS=s=>{if(!s)return"";const[,m,d]=s.split("-");return`${+m}月${+d}日`;};
const fML=(y,m)=>`${y}年 ${m}月`;
const sM=(s,y,m)=>s?.startsWith(`${y}-${String(m).padStart(2,"0")}`);
const nid=()=>Date.now()+Math.random();
const ftm=(items,tf)=>{
  if(tf==="總覽")return items;
  if(tf==="年度")return items.filter(i=>i.date?.startsWith(String(TY)));
  if(typeof tf==="number")return items.filter(i=>i.date?.startsWith(String(tf)));
  if(tf==="本月")return items.filter(i=>sM(i.date,TY,TM));
  if(typeof tf==="object")return items.filter(i=>sM(i.date,tf.y,tf.m));
  return items;
};
const aF=d=>[
  ...d.movies.map(i=>({...i,_cat:"電影"})),
  ...d.dramas.map(i=>({...i,_cat:"戲劇"})),
  ...d.exhibitions.map(i=>({...i,_cat:"展覽"})),
  ...d.concerts.map(i=>({...i,_cat:"演唱會"})),
];

/* ── SVG ICONS ─────────────────────────────────────── */
const Sv=({s=22,vb="0 0 24 24",sw=1.6,col,ch})=>(
  <svg width={s} height={s} viewBox={vb} fill="none" stroke={col||"currentColor"} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">{ch}</svg>
);
const IH=({s=22})=><Sv s={s} ch={<path d="M3 12L12 3l9 9v8a1 1 0 01-1 1h-5v-5h-4v5H4a1 1 0 01-1-1v-8z"/>}/>;
const IFm=({s=22})=><Sv s={s} ch={<><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M7 6V3M12 6V3M17 6V3"/></>}/>;
const IDr=({s=22})=><Sv s={s} ch={<><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 20h8M12 17v3"/><path d="M10 10l5 2.5-5 2.5V10z" fill="currentColor" stroke="none"/></>}/>;
const IGl=({s=22})=><Sv s={s} ch={<><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none"/><polyline points="21 15 16 10 5 21"/></>}/>;
const IMu=({s=22})=><Sv s={s} ch={<><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></>}/>;
const ISr=({s=22})=><Sv s={s} ch={<><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>}/>;
const ISt=({s=22})=><Sv s={s} ch={<><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></>}/>;
const IPlus=({s=18})=><Sv s={s} sw={2.5} ch={<><line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/></>}/>;
const IXc=({s=18})=><Sv s={s} sw={2.2} ch={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>}/>;
const IEd=({s=15})=><Sv s={s} ch={<><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4z"/></>}/>;
const ITr=({s=15})=><Sv s={s} ch={<><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></>}/>;
const ICL=({s=16})=><Sv s={s} sw={2} ch={<polyline points="15 18 9 12 15 6"/>}/>;
const ICR=({s=16})=><Sv s={s} sw={2} ch={<polyline points="9 18 15 12 9 6"/>}/>;
const ICD=({s=13})=><Sv s={s} sw={2} ch={<polyline points="6 9 12 15 18 9"/>}/>;
const IPn=({s=14})=><Sv s={s} ch={<><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></>}/>;
const IDl=({s=16})=><Sv s={s} ch={<><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>}/>;
const IUl=({s=16})=><Sv s={s} ch={<><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>}/>;

/* ── FACE EXPRESSIONS: angry/blank/slight/big/open ─ */
// Each face drawn in 24×24 viewBox
const FACES=[null,
  // 1 angry
  <g key="a"><circle cx="9" cy="10" r="1.3" fill="currentColor"/><circle cx="15" cy="10" r="1.3" fill="currentColor"/><path d="M8.5 15.5c1-1.2 6-1.2 7 0" stroke="currentColor" strokeWidth={1.4} fill="none" strokeLinecap="round"/><path d="M7 7.5l3 1.5" stroke="currentColor" strokeWidth={1.5} strokeLinecap="round"/><path d="M17 7.5l-3 1.5" stroke="currentColor" strokeWidth={1.5} strokeLinecap="round"/></g>,
  // 2 blank
  <g key="b"><circle cx="9" cy="10" r="1.3" fill="currentColor"/><circle cx="15" cy="10" r="1.3" fill="currentColor"/><line x1="8.5" y1="15" x2="15.5" y2="15" stroke="currentColor" strokeWidth={1.4} strokeLinecap="round"/></g>,
  // 3 slight smile
  <g key="c"><circle cx="9" cy="10" r="1.3" fill="currentColor"/><circle cx="15" cy="10" r="1.3" fill="currentColor"/><path d="M9 14.5c1.2.9 5 .9 6 0" stroke="currentColor" strokeWidth={1.4} fill="none" strokeLinecap="round"/></g>,
  // 4 big smile
  <g key="d"><circle cx="9" cy="10" r="1.3" fill="currentColor"/><circle cx="15" cy="10" r="1.3" fill="currentColor"/><path d="M8 13.5c1.2 2.8 7 2.8 8 0" stroke="currentColor" strokeWidth={1.4} fill="none" strokeLinecap="round"/></g>,
  // 5 open mouth laugh
  <g key="e"><circle cx="9" cy="10" r="1.3" fill="currentColor"/><circle cx="15" cy="10" r="1.3" fill="currentColor"/><path d="M8 13c1.5 3.5 8.5 3.5 8 0" stroke="currentColor" strokeWidth={1.4} fill="none" strokeLinecap="round"/><ellipse cx="12" cy="16" rx="2.5" ry="1.5" fill="currentColor" opacity=".25"/></g>,
];
const MLABELS=["","難看","普通","還行","不錯","讚讚"];

function FaceCircle({n,size=30,active=false}){
  const col=active?FACE_C[n]:"#C0B8B0";
  const bg=active?FACE_C[n]+"18":"transparent";
  return(
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" style={{display:"block"}}>
      <circle cx="12" cy="12" r="10.5" stroke={col} strokeWidth={active?1.8:1.4} fill={bg}/>
      {active&&FACES[n]&&<g stroke={col} fill={col} transform="translate(0,1)">{FACES[n]}</g>}
    </svg>
  );
}

function MoodPicker({value=0,onChange}){
  return(
    <div style={{display:"flex",gap:6,alignItems:"center"}}>
      {[1,2,3,4,5].map(n=>{
        const isSelected=n===value;
        return(
          <button key={n} className="tap" type="button" onClick={e=>{e.preventDefault();e.stopPropagation();onChange&&onChange(value===n?0:n);}}
            style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,background:"none",border:"none",padding:0,
              transform:isSelected?"scale(1.1)":"scale(1)",transition:"transform .15s"}}>
            <FaceCircle n={n} size={30} active={isSelected}/>
            <span style={{fontSize:9,color:isSelected?FACE_C[n]:"#C0B8B0",fontWeight:isSelected?500:300,letterSpacing:".2px"}}>{isSelected?MLABELS[n]:""}</span>
          </button>
        );
      })}
    </div>
  );
}

// Display: show all 5 circles, only the rated one is filled with face
function MoodIcon({value,size=22}){
  if(!value||value<1)return null;
  return(
    <div style={{display:"flex",gap:3,alignItems:"center"}}>
      {[1,2,3,4,5].map(n=>{
        const isRated=n===value;
        const col=isRated?FACE_C[value]:"#D0C8C0";
        return(
          <svg key={n} width={size} height={size} viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10.5" stroke={col} strokeWidth={isRated?1.8:1.2} fill={isRated?col+"18":"none"}/>
            {isRated&&FACES[value]&&<g stroke={col} fill={col} transform="translate(0,1)">{FACES[value]}</g>}
          </svg>
        );
      })}
    </div>
  );
}


/* ── CUSTOM DATE PICKER (3 selects, no jumping) ─────── */
function DatePicker({value,onChange,th=T}){
  const isDark=th.bg==="#141218";
  const NOW_Y=new Date().getFullYear();

  // parse existing value
  const parts=(value||"").split("-");
  const selY=parts[0]?parseInt(parts[0]):null;
  const selM=parts[1]?parseInt(parts[1]):null;
  const selD=parts[2]?parseInt(parts[2]):null;

  // viewing state — defaults to selected or current month
  const[viewY,setViewY]=useState(selY||NOW_Y);
  const[viewM,setViewM]=useState(selM||new Date().getMonth()+1);

  const daysInMonth=new Date(viewY,viewM,0).getDate();
  const firstDay=new Date(viewY,viewM-1,1).getDay();
  const isSelected=(d)=>selY===viewY&&selM===viewM&&selD===d;
  const isToday=(d)=>{const n=new Date();return n.getFullYear()===viewY&&n.getMonth()+1===viewM&&n.getDate()===d;};

  const prevMonth=()=>{if(viewM===1){setViewM(12);setViewY(y=>y-1);}else setViewM(m=>m-1);};
  const nextMonth=()=>{if(viewM===12){setViewM(1);setViewY(y=>y+1);}else setViewM(m=>m+1);};

  const pick=(d)=>{
    const yy=String(viewY);
    const mm=String(viewM).padStart(2,"0");
    const dd=String(d).padStart(2,"0");
    onChange(`${yy}-${mm}-${dd}`);
  };

  const bg=isDark?"#1E1C24":"#FBF9F6";
  const border=isDark?"#3A3648":T.line;
  const inkC=isDark?"#EDE8F4":T.ink;
  const inkS=isDark?"#A8A0C0":T.ink3;
  const inkF=isDark?"#7A7898":T.ink4;

  return(
    <div style={{background:bg,border:`1.5px solid ${border}`,borderRadius:14,overflow:"hidden"}}>
      {/* Month navigation */}
      <div className="cal-nav" style={{display:"flex",alignItems:"center",padding:"10px 14px",borderBottom:`1px solid ${border}`,gap:8}}>
        <button className="tap" type="button" onClick={e=>{e.preventDefault();prevMonth();}} style={{width:28,height:28,borderRadius:"50%",border:`1.5px solid ${border}`,display:"flex",alignItems:"center",justifyContent:"center",color:inkS,background:"none",flexShrink:0}}>
          <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2.5} strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div style={{flex:1,display:"flex",flexDirection:"row",alignItems:"center",justifyContent:"center",gap:4,whiteSpace:"nowrap"}}>
          <select value={viewY} onChange={e=>setViewY(parseInt(e.target.value))}
            onClick={e=>e.stopPropagation()}
            style={{background:"none",border:"none",fontSize:13,fontWeight:500,color:inkC,cursor:"pointer",outline:"none",appearance:"none",WebkitAppearance:"none",MozAppearance:"none",width:"auto",minWidth:56,flexShrink:0,textAlign:"center"}}>
            {Array.from({length:10},(_,i)=>NOW_Y-i).map(y=><option key={y} value={y}>{y}年</option>)}
          </select>
          <select value={viewM} onChange={e=>setViewM(parseInt(e.target.value))}
            onClick={e=>e.stopPropagation()}
            style={{background:"none",border:"none",fontSize:13,fontWeight:500,color:inkC,cursor:"pointer",outline:"none",appearance:"none",WebkitAppearance:"none",MozAppearance:"none",width:"auto",minWidth:40,flexShrink:0,textAlign:"center"}}>
            {Array.from({length:12},(_,i)=>i+1).map(m=><option key={m} value={m}>{m}月</option>)}
          </select>
        </div>
        <button className="tap" type="button" onClick={e=>{e.preventDefault();nextMonth();}} style={{width:28,height:28,borderRadius:"50%",border:`1.5px solid ${border}`,display:"flex",alignItems:"center",justifyContent:"center",color:inkS,background:"none",flexShrink:0}}>
          <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2.5} strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      {/* Weekday headers */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",padding:"8px 8px 4px"}}>
        {["日","一","二","三","四","五","六"].map(d=>(
          <div key={d} style={{textAlign:"center",fontSize:10,color:inkF,fontWeight:500,paddingBottom:4}}>{d}</div>
        ))}
      </div>

      {/* Day grid */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,padding:"0 8px 10px"}}>
        {Array(firstDay).fill(null).map((_,i)=><div key={`e${i}`}/>)}
        {Array.from({length:daysInMonth},(_,i)=>i+1).map(d=>{
          const sel=isSelected(d);
          const tod=isToday(d);
          return(
            <button key={d} className="tap" type="button" onClick={e=>{e.preventDefault();e.stopPropagation();pick(d);}} style={{
              height:34,borderRadius:34,border:"none",
              background:sel?T.rose:tod?"transparent":"transparent",
              color:sel?"#fff":tod?T.rose:inkC,
              fontSize:12,fontWeight:sel||tod?600:300,
              outline:tod&&!sel?`1.5px solid ${T.rose}`:"none",
              cursor:"pointer",
              transition:"background .12s",
            }}>{d}</button>
          );
        })}
      </div>

      {/* Selected value display */}
      {value&&(
        <div style={{padding:"8px 14px 10px",borderTop:`1px solid ${border}`,fontSize:11,color:T.rose,fontWeight:500,textAlign:"center"}}>
          已選：{selY}年{selM}月{selD}日
        </div>
      )}
    </div>
  );
}

/* ── DATE DISPLAY ──────────────────────────────────── */
const DTag=({date,th=T})=>(
  <span className="num" style={{fontSize:12,fontWeight:500,color:th.ink2,letterSpacing:".5px",display:"inline-flex",alignItems:"center",gap:5}}>
    <svg width={11} height={11} viewBox="0 0 24 24" fill="none" stroke={th.ink3} strokeWidth={2} strokeLinecap="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    {fD(date)}
  </span>
);

/* ── SMALL TAG ─────────────────────────────────────── */
const Tg=({label,col})=>(
  <span style={{display:"inline-block",padding:"2px 9px",borderRadius:20,fontSize:11,fontWeight:400,color:col||"#706860",border:`1.5px solid ${col||"#C8C0B8"}`,letterSpacing:".2px"}}>{label}</span>
);

/* ── STREAMS ────────────────────────────────────────── */

const tmdbFetch=async(path)=>{
  const r=await fetch(`https://api.themoviedb.org/3${path}`,{
    headers:{Authorization:`Bearer ${TMDB_TOKEN}`,Accept:"application/json"},
  });
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
};

function TmdbSearch({titleRef,onApply,th=T}){
  const[status,setStatus]=useState("idle");
  const[results,setResults]=useState([]);
  const[searchedFor,setSearchedFor]=useState("");
  const isDark=th.bg==="#141218";

  const search=async(e)=>{
    if(e){e.preventDefault();e.stopPropagation();}
    const raw=titleRef.current;
    const title=(raw&&typeof raw==="object"?raw.title:raw)||"";
    if(!title.trim())return;
    setSearchedFor(title.trim());
    setStatus("loading");
    setResults([]);
    try{
      const q=encodeURIComponent(title.trim());
      const [r1,r2]=await Promise.all([
        tmdbFetch(`/search/multi?query=${q}&language=zh-TW&page=1`).catch(()=>({results:[]})),
        tmdbFetch(`/search/multi?query=${q}&language=en-US&page=1`).catch(()=>({results:[]})),
      ]);
      const seen=new Set();
      const merged=[];
      for(const item of [...(r1.results||[]),...(r2.results||[])]){
        if(!seen.has(item.id)&&(item.media_type==="movie"||item.media_type==="tv")){
          seen.add(item.id);
          merged.push(item);
        }
      }
      if(merged.length===0){setStatus("notfound");return;}
      const top=merged.slice(0,3);
      const detailed=await Promise.all(top.map(async item=>{
        try{
          const type=item.media_type==="movie"?"movie":"tv";
          const d=await tmdbFetch(`/${type}/${item.id}?language=zh-TW&append_to_response=external_ids`);
          return{...item,...d,_type:type};
        }catch{return{...item,_type:item.media_type==="movie"?"movie":"tv"};}
      }));
      setResults(detailed);
      setStatus("found");
    }catch(e){
      setStatus("error");
    }
  };

  const apply=(item)=>{
    const score=item.vote_average?item.vote_average.toFixed(1):"";
    const zhTitle=item.title||item.name||"";
    const enTitle=item.original_title||item.original_name||"";
    const year=(item.release_date||item.first_air_date||"").slice(0,4);
    const runtime=item.runtime?`${item.runtime} min`:(item.episode_run_time?.[0]?`${item.episode_run_time[0]} min`:"");
    const genres=(item.genres||[]).map(g=>g.name).join(", ");
    onApply({imdbRating:score,imdbTitle:enTitle!==zhTitle?enTitle:"",imdbYear:year,imdbGenre:genres,imdbRuntime:runtime});
    setStatus("applied");
  };

  const reset=()=>{
    setStatus("idle");
    setResults([]);
    onApply({imdbRating:"",imdbTitle:"",imdbYear:"",imdbGenre:"",imdbRuntime:"",tmdbZhTitle:""});
  };

  if(status==="applied")return(
    <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",background:isDark?"#182818":"#EAF2EC",borderRadius:10,marginTop:6}}>
      <span style={{fontSize:12,color:isDark?"#7AB890":"#2E7858",fontWeight:500,flex:1}}>✓ 已帶入評分資料</span>
      <button type="button" onClick={reset} style={{fontSize:11,color:T.ink3,background:"none",border:`1px solid ${th.line}`,borderRadius:20,padding:"2px 10px",cursor:"pointer",fontFamily:"inherit"}}>移除</button>
    </div>
  );

  return(
    <div style={{marginTop:6}}>
      <button type="button" className="tap" onClick={search} disabled={status==="loading"} style={{
        display:"flex",alignItems:"center",gap:6,padding:"7px 14px",borderRadius:20,fontSize:12,fontWeight:500,
        background:status==="loading"?th.line:isDark?"#1E2030":"#EEF2FF",
        color:status==="loading"?th.ink4:isDark?"#8AA0D0":"#3A5A90",
        border:`1.5px solid ${status==="loading"?th.line:isDark?"#3A4060":"#B0C0E8"}`,
        cursor:status==="loading"?"default":"pointer",fontFamily:"inherit",transition:"all .15s",
      }}>
        {status==="loading"?<><span style={{animation:"spin 1s linear infinite",display:"inline-block"}}>⟳</span> 搜尋中...</>:<>搜尋評分</>}
      </button>

      {status==="notfound"&&<div style={{fontSize:11,color:T.ink3,marginTop:6,padding:"6px 10px",background:th.line+"22",borderRadius:8}}>找不到「{searchedFor}」，試試其他關鍵字</div>}
      {status==="error"&&<div style={{fontSize:11,color:"#906050",marginTop:6,padding:"8px 12px",background:"#FFF0E8",border:"1px solid #E8C0A0",borderRadius:8}}>⚠️ 連線失敗，請確認網路後再試</div>}

      {status==="found"&&results.length>0&&(
        <div style={{marginTop:8,background:isDark?"#1E2030":"#EEF2FF",border:`1.5px solid ${isDark?"#3A4060":"#B0C0E8"}`,borderRadius:12,overflow:"hidden"}}>
          {results.map((item,i)=>{
            const zhTitle=item.title||item.name||"";
            const enTitle=item.original_title||item.original_name||"";
            const year=(item.release_date||item.first_air_date||"").slice(0,4);
            const score=item.vote_average?item.vote_average.toFixed(1):"N/A";
            const type=item._type==="movie"?"電影":"影集";
            return(
              <div key={item.id} style={{borderBottom:i<results.length-1?`1px solid ${isDark?"#3A4060":"#B0C0E8"}`:"none"}}>
                <div style={{padding:"10px 12px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:3}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:500,color:th.ink,lineHeight:1.35}}>{zhTitle}</div>
                      {enTitle!==zhTitle&&<div style={{fontSize:10,color:th.ink3,marginTop:1}}>{enTitle}</div>}
                    </div>
                    <span style={{background:"#F5C840",color:"#2A2520",fontFamily:"'Space Grotesk',sans-serif",fontSize:12,fontWeight:700,padding:"2px 7px",borderRadius:5,flexShrink:0,marginLeft:8}}>{score}</span>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <span style={{fontSize:10,color:isDark?"#8AA0D0":"#5A7AB0",background:isDark?"#2A3050":"#E0E8F8",padding:"1px 7px",borderRadius:20}}>{type}</span>
                    {year&&<span style={{fontSize:10,color:th.ink3}}>{year}</span>}
                    {item.genres&&item.genres[0]&&<span style={{fontSize:10,color:th.ink3}}>{item.genres[0].name}</span>}
                  </div>
                </div>
                <button type="button" className="tap" onClick={()=>apply(item)} style={{width:"100%",padding:"8px",background:isDark?"#2A3868":"#6E88B0",color:"#fff",border:"none",fontSize:12,fontWeight:500,cursor:"pointer",fontFamily:"inherit"}}>套用 →</button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function WatchLater({data,setData,th}){
  const[input,setInput]=useState("");

    const t=input.trim();
    if(!t)return;
    setData(d=>({...d,watchlater:[{id:Date.now(),title:t,addedAt:new Date().toISOString().slice(0,10)},...(d.watchlater||[])]}));
    setInput("");
  };
  const del=(id)=>setData(d=>({...d,watchlater:(d.watchlater||[]).filter(i=>i.id!==id)}));
  return(
    <div style={{marginTop:20}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:500,color:th.ink,display:"flex",alignItems:"center",gap:6}}>
          <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={1.8} strokeLinecap="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> 待看清單
          {list.length>0&&<span style={{fontSize:11,color:T.rose,background:th.roseBg,padding:"1px 8px",borderRadius:20}}>{list.length}</span>}
        </div>
        <button className="tap" type="button" onClick={()=>setShow(s=>!s)}
          style={{fontSize:11,color:th.ink4,background:"none",border:"none",cursor:"pointer"}}>
          {show?"收起 ▲":"展開 ▼"}
        </button>
      </div>
      {show&&(
        <>
          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <input value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter")add();}}
              placeholder="加入待看片名..."
              style={{flex:1,fontSize:13,padding:"9px 13px",background:th.white,border:`1.5px solid ${th.line}`,color:th.ink,borderRadius:12,fontFamily:"inherit"}}/>
            <button type="button" className="tap" onClick={add}
              style={{width:40,height:40,borderRadius:"50%",background:T.rose,border:"none",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,cursor:"pointer"}}>
              <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth={2.5} strokeLinecap="round"><line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
            </button>
          </div>
          {list.length===0&&(
            <div style={{textAlign:"center",padding:"16px 0",color:th.ink4,fontSize:12}}>還沒有待看的～</div>
          )}
          {list.map(item=>(
            <div key={item.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:th.white,borderRadius:12,border:`1.5px solid ${th.line}`,marginBottom:8}}>
              <div style={{flex:1}}>
                <div style={{fontSize:13,color:th.ink,lineHeight:1.4}}>{item.title}</div>
                <div style={{fontSize:10,color:th.ink4,marginTop:2}}>加入於 {item.addedAt}</div>
              </div>
              <button type="button" className="tap" onClick={()=>del(item.id)}
                style={{width:28,height:28,borderRadius:"50%",border:`1px solid ${th.line}`,background:th.surface||th.white,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}>

              </button>
            </div>

// sort modes: "dateDesc" | "dateAsc" | "ratingDesc"
const SortBtn=({sort,onToggle,th=T})=>{
  const short={dateDesc:"↓日期",dateAsc:"↑日期",ratingDesc:"↓評分",ratingAsc:"↑評分"};
  return(
    <div style={{position:"relative",flexShrink:0}}>
      <select value={sort} onChange={e=>onToggle(e.target.value)}
        style={{padding:"4px 18px 4px 7px",borderRadius:20,fontSize:10,fontWeight:400,
          background:sort!=="dateDesc"?T.rose:th.white,
          color:sort!=="dateDesc"?"#fff":th.ink3,
          border:`1.5px solid ${sort!=="dateDesc"?T.rose:th.line}`,
          appearance:"none",WebkitAppearance:"none",cursor:"pointer",outline:"none",fontFamily:"inherit",paddingRight:"14px",
          }}>
        <option value="dateDesc">↓ 由新到舊</option>
        <option value="dateAsc">↑ 由舊到新</option>
        <option value="ratingDesc">★ 評分高到低</option>
        <option value="ratingAsc">☆ 評分低到高</option>
      </select>
    </div>
  );
};
function mkSortFn(sort){
  if(sort==="dateAsc")return(a,b)=>a.date.localeCompare(b.date);
  if(sort==="ratingDesc")return(a,b)=>(b.rating||0)-(a.rating||0)||b.date.localeCompare(a.date);
  if(sort==="ratingAsc")return(a,b)=>(a.rating||0)-(b.rating||0)||b.date.localeCompare(a.date);
  return(a,b)=>b.date.localeCompare(a.date);
}

const STypes=["古蹟","遊樂園","休閒中心","農場","其他"];
function FSpot({init,onSave,onClose,th=T}){
  const blank={title:"",city:"",type:"古蹟",customType:"",date:"",rating:0,price:"",currency:"NT$",notes:""};
  const[f,sf]=useState(init?{...blank,...init}:blank);
  const fRef=React.useRef(f);
  const s=(k,v)=>{const next={...fRef.current,[k]:v};fRef.current=next;sf(next);};
  const isDark=th.bg==="#141218";
  const cb=isDark?"#252330":"#FAFAF7",ct=isDark?"#C8C0D8":T.ink3,cbr=isDark?"#3A3648":T.line;

            {CURRENCIES.map(cur=>(

                style={{padding:"8px 10px",borderRadius:10,fontSize:12,fontFamily:"'Space Grotesk',sans-serif",background:f.currency===cur?T.sage:cb,color:f.currency===cur?"#fff":ct,border:`1.5px solid ${f.currency===cur?T.sage:cbr}`}}>{cur}</button>

    // ── S8: AI SUMMARY ──────────────────────────────────────────
    ()=>(
      <div style={{minHeight:460,position:"relative",overflow:"hidden",background:"#FAF7F2"}}>

        <div style={{background:`linear-gradient(135deg,${T.navy} 0%,#6070A0 100%)`,padding:"20px 20px 16px",position:"relative",overflow:"hidden"}}>

        <div style={{padding:"14px 18px 20px"}}>

          <div style={{background:"#fff",borderRadius:10,padding:"12px 14px",border:`1px solid ${T.line}`,marginBottom:10}}>

            {[
              [T.catM.line,`${mC} 部電影 · ${dC} 部戲劇 · ${eC} 場活動 · ${cC} 場演唱會`],

              <div key={i} style={{display:"flex",alignItems:"center",gap:7,fontSize:11,color:"#4A4540",marginBottom:i<2?5:0}}>

  return(
    <div className="page">

              <path d="M13.8 76.8l24.25-25.55L49.3 51.25 43.65 25 13.8 76.8z" fill="#FFBA00"/>
            </svg>
          </div>
          <div style={{textAlign:"left",flex:1}}>
            <div style={{fontSize:13,fontWeight:500,color:th.ink}}>備份到 Google Drive</div>
            <div style={{fontSize:10,color:th.ink4,marginTop:1}}>①下載 JSON → ②自動開啟 Drive → ③手動上傳</div>
          </div>
          <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke={th.ink4} strokeWidth={2} strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div style={{padding:"0 16px 12px"}}>
          <div style={{fontSize:10,color:th.ink4,lineHeight:1.8,background:th.bg,borderRadius:8,padding:"8px 10px"}}>
            <div style={{fontWeight:500,marginBottom:2,color:th.ink3}}>使用步驟</div>
            <div>① 點擊後自動下載備份檔案</div>
            <div>② Google Drive 自動開啟</div>
            <div>③ 將下載的 .json 檔拖入 Drive</div>
            <div style={{marginTop:4,color:T.rose}}>建議每個月備份一次 ✦</div>
          </div>
        </div>
      </div>

      <div style={{fontSize:11,fontWeight:500,color:th.ink4,letterSpacing:"1.2px",textTransform:"uppercase",marginBottom:8,marginTop:8}}>紀錄總覽</div>
      <Row>
        {[["電影",data.movies.length,"部"],["戲劇",data.dramas.length,"部"],["展覽",data.exhibitions.length,"場"],["演唱會",data.concerts.length,"場"]].map(([label,n,unit],i,arr)=>(

        <div style={{fontSize:16,marginBottom:4}}>✦</div>
        <div style={{fontWeight:500,color:th.ink3}}>Lumière</div>
        <div style={{marginTop:2}}>娛樂手札 · 所有資料僅存於本機</div>
      </div>
    </div>

/* ── BOTTOM NAV ────────────────────────────────────── */
const NAVS=[
  {k:"home",lb:"首頁",I:IH},
  {k:"watchlist",lb:"片單",I:IFm},
  {k:"exhibition",lb:"活動",I:IGl},
  {k:"concert",lb:"演唱會",I:IMu},
  {k:"stats",lb:"統計",I:ISt},
  {k:"settings",lb:"設定",I:ISettings},
];

function ScrollTop({th}){
  const[show,setShow]=useState(false);
  useEffect(()=>{
    const el=document.documentElement;
    const onScroll=()=>setShow(el.scrollTop>300);
    window.addEventListener("scroll",onScroll,{passive:true});
    return()=>window.removeEventListener("scroll",onScroll);
  },[]);
  if(!show)return null;
  return(
    <button className="tap" onClick={()=>window.scrollTo({top:0,behavior:"smooth"})}
      style={{
        position:"fixed",bottom:100,right:"max(16px,calc(50% - 220px))",
        width:40,height:40,borderRadius:"50%",
        background:th.white,border:`1.5px solid ${th.line}`,
        display:"flex",alignItems:"center",justifyContent:"center",
        boxShadow:"0 2px 12px rgba(0,0,0,.15)",
        zIndex:89,cursor:"pointer",color:th.ink3,
      }}>
      <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2.5} strokeLinecap="round"><polyline points="18 15 12 9 6 15"/></svg>
    </button>
  );
}

function BNav({active,onNav,dark,th}){
  const navBg=dark?"rgba(20,18,24,.98)":"rgba(244,243,248,.98)";
  return(
    <nav style={{
      position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",
      zIndex:100,width:"100%",maxWidth:480,
      background:navBg,backdropFilter:"blur(20px)",
      borderTop:`1px solid ${th.line}`,
      display:"flex",justifyContent:"space-around",alignItems:"center",
      padding:"10px 0 max(16px,env(safe-area-inset-bottom))",
    }}>
      {NAVS.map(({k,lb,I})=>{
        const on=active===k;
        return(
          <button key={k} className="tap" onClick={()=>onNav(k)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,color:on?T.navy:th.ink4,padding:"4px 10px",minWidth:52,transition:"color .15s"}}>
            <div style={{width:40,height:32,borderRadius:14,background:on?T.periBg:"transparent",display:"flex",alignItems:"center",justifyContent:"center",transition:"background .15s"}}><I s={20}/></div>
            <span style={{fontSize:10,fontWeight:on?500:400,letterSpacing:".2px"}}>{lb}</span>
          </button>
        );
      })}
    </nav>
  );
}

/* ── APP ───────────────────────────────────────────── */
function App(){
  const[page,setPage]=useState("home");
  const[data,setData]=useState(()=>loadData());
  const[settings,setSettings]=useState(()=>loadSettings());
  const th=getTheme(settings.dark);

  // persist data to localStorage whenever it changes
  useEffect(()=>{ saveData(data); },[data]);
  useEffect(()=>{ saveSettings(settings); },[settings]);

  // apply dark bg to body
  useEffect(()=>{
    document.body.style.background=th.bg;
    document.body.style.color=th.ink;
  },[th]);

  // Pass th to Stats & other pages via context-like prop threading
  return(
    <div style={{background:th.bg,minHeight:"100vh",width:"100%",paddingBottom:80,transition:"background .3s",overflowX:"hidden"}}>
      <ScrollTop th={th}/>
      {page==="home"&&<Home data={data} setData={setData} onNav={setPage} settings={settings} th={th}/>}
      {page==="watchlist"&&<Watchlist data={data} setData={setData} th={th}/>}
      {page==="exhibition"&&<Exhibition data={data} setData={setData} th={th}/>}
      {page==="concert"&&<Concert data={data} setData={setData} th={th}/>}
      {page==="search"&&<Search data={data} th={th}/>}
      {page==="stats"&&<Stats data={data} th={th}/>}
      {page==="settings"&&<SettingsPage settings={settings} setSettings={setSettings} data={data} setData={setData} th={th}/>}
      <BNav active={page} onNav={setPage} dark={settings.dark} th={th}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
